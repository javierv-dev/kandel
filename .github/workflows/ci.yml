# Integración continua del proyecto nuevo (raíz). No incluye legacy/ (módulo aparte).
name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compilar (CGO deshabilitado, binario estático)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Analizar (go vet)
        run: go vet ./...

      - name: Pruebas
        run: go test ./...

  # Job de build de release (§21 Eje 1): solo corre al empujar un tag vX.Y.Z. Cross-compila el binario
  # estático (CGO_ENABLED=0) para cada plataforma soportada, inyecta los metadatos de versión por
  # ldflags y sube cada binario como artifact. NO toca la GitHub Release: la publicación queda en un
  # único job (publish) para evitar que los jobs de la matriz compitan al crear la Release (carrera).
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compilar binario de release
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN="kandel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }} -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%Y-%m-%d)" \
            -o "$BIN" ./cmd/kandel
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Subir binario como artifact
        uses: actions/upload-artifact@v4
        with:
          name: kandel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  # Job de publish: corre UNA sola vez tras compilar toda la matriz. Baja los artifacts de las 4
  # plataformas y crea/actualiza la GitHub Release con todos los binarios de una. Un único escritor de
  # la Release elimina la carrera de raíz (bug: los jobs de la matriz competían al crear la Release).
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para crear la Release y subir los binarios
    steps:
      - name: Bajar todos los binarios
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
