# Integración continua del proyecto nuevo (raíz). No incluye legacy/ (módulo aparte).
name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compilar (CGO deshabilitado, binario estático)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Analizar (go vet)
        run: go vet ./...

      - name: Pruebas
        run: go test ./...

  # Job de release (§21 Eje 1): solo corre al empujar un tag vX.Y.Z. Cross-compila el binario
  # estático (CGO_ENABLED=0) para cada plataforma soportada, inyecta los metadatos de versión por
  # ldflags y sube cada binario a la GitHub Release del tag.
  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para crear la Release y subir los binarios
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compilar binario de release
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN="kandel-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }} -X main.commit=$(git rev-parse --short HEAD) -X main.buildDate=$(date -u +%Y-%m-%d)" \
            -o "$BIN" ./cmd/kandel
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Publicar en la Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BIN }}
